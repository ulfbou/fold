[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fold-protocol"
version = "0.1.0"
description = "Compress collaboration state into an inspectable working surface"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ulf Bourelius"}]
dependencies = []

[project.scripts]
fold = "fold.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/fold"]
