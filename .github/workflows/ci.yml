name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest
      - run: python tools/fold-changelog verify
      - run: python -m compileall -q src tests
      - name: Enforce source and documentation standards
        run: python tools/check-standards
      - name: Check PR or push range for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...HEAD"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" HEAD
          else
            git diff --check "$PUSH_BEFORE_SHA" HEAD
          fi
